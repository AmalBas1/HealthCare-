
spring.application.name=HealthCare
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare?createDatabaseIfNotExist=true&sslMode=REQUIRED}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 5. إعدادات JWT (الأمان)
healthcare.app.jwtSecret=${JWT_SECRET}
healthcare.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}


spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms
spring.cache.type=redis